name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --check gitwatch/static/app.js
      - run: node --test tests/test_branch_loader.cjs
      - run: bash -n scripts/install.sh scripts/update.sh
